[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opttreat-ccg2025"
version = "0.1.0"
description = "Simulation tools for optimal treatment parameter estimation."
readme = "opttreat/README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
notebook = [
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
include = ["opttreat*"]

[tool.setuptools.package-data]
opttreat = [
    "README.md",
    "models/*.md",
    "simulations/*/*.md",
    "simulations/*/*.ipynb",
    "simulations/*/results/*.csv",
    "simulations/*/results/*.md",
]
